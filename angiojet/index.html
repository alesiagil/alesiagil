    const KEY = 'ag_pw_autoelite';
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function decrypt(pw) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
      return new TextDecoder().decode(buf);
    }
    async function tryUnlock(pw, silent) {
      const btn = document.getElementById('go'), err = document.getElementById('err');
      btn.disabled = true;
      try {
        const html = await decrypt(pw);
        try { sessionStorage.setItem(KEY, pw); } catch (e) {}
        document.open(); document.write(html); document.close();
      } catch (e) {
        try { sessionStorage.removeItem(KEY); } catch (e2) {}
        if (!silent) err.style.display = 'block';
        btn.disabled = false;
        const i = document.getElementById('pw'); i.value = ''; i.focus();
      }
    }
    document.getElementById('gate').addEventListener('submit', e => {
      e.preventDefault(); tryUnlock(document.getElementById('pw').value, false);
    });
    let saved = null;
    try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    if (saved) tryUnlock(saved, false);
  </script>
